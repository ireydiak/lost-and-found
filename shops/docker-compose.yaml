services:
  postgres:
    image: imresamu/postgis:17-3.5
    restart: always
    environment:
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: shops
    ports:
      - "5432:5432"
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:admin@postgres:5432/shops?sslmode=disable

volumes:
  data:
