# fly.toml app configuration file generated for lost-and-found-silver-voice-4700 on 2026-07-18T18:11:01-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'lost-and-found-silver-voice-4700'
primary_region = 'yyz'

[build]
[deploy]
  release_command = 'migrate'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/shops'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
